<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>魔方状态图例构建工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F8F6F3;
    min-height: 100vh;
    color: #1D2129;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app-container {
    width: 100%;
    max-width: 420px;
    background: #FFFFFF;
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 标题栏 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 20px 16px;
  }
  .header-title {
    font-size: 18px;
    font-weight: 600;
  }

  /* 内容区域 */
  .content {
    padding: 0 20px;
    overflow-y: auto;
  }

  /* 模板选择 */
  .template-selector {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .template-btn {
    padding: 8px 16px;
    border: 1px solid #DCDFE6;
    border-radius: 8px;
    background: #F5F7FA;
    color: #86909C;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .template-btn:hover { border-color: #165DFF; color: #165DFF; }
  .template-btn.active {
    background: #165DFF;
    border-color: #165DFF;
    color: #FFF;
  }

  /* SVG 展示区 */
  .svg-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    background: #f5f7fa;
    border-radius: 8px;
  }
  .svg-wrapper svg {
    width: 100%;
    max-width: 300px;
    height: auto;
  }
  .svg-wrapper .sticker {
    cursor: pointer;
    transition: all 0.2s;
  }
  .svg-wrapper .sticker:hover { opacity: 0.8; }

  /* 色板区域 */
  .color-section { margin-top: 16px; margin-bottom: 8px; }
  .color-btn-wrapper {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .color-btn {
    height: 40px;
    border: 2px solid #DCDFE6;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-size: 11px;
    color: #333;
    font-weight: 500;
  }
  .color-btn:hover { border-color: #165DFF; transform: scale(1.05); }
  .color-btn.active {
    border-color: #165DFF;
    border-width: 3px;
    box-shadow: 0 0 0 2px rgba(22,93,255,0.2);
  }
  .clear-btn { background: #F5F7FA; color: #86909C; }
  .clear-btn:hover { color: #165DFF; border-color: #165DFF; }
  .color-label { text-shadow: 0 0 2px rgba(0,0,0,0.5); }

  /* 提示文字 */
  .mode-hint {
    text-align: center;
    margin-top: 10px;
    font-size: 13px;
    color: #86909C;
  }
  .mode-hint.active-hint { color: #165DFF; }

  /* 底部按钮 */
  .footer {
    display: flex;
    gap: 12px;
    padding: 16px 20px 24px;
    justify-content: center;
  }
  .action-btn {
    flex: 1;
    height: 44px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .action-btn.secondary {
    background: #F2F3F5;
    color: #1D2129;
  }
  .action-btn.secondary:active { background: #E5E7EB; }
  .action-btn.primary {
    background: #165DFF;
    color: #FFF;
  }
  .action-btn.primary:active { background: #0E42D2; }
</style>
</head>
<body>

<div class="app-container">
  <!-- 标题 -->
  <div class="header">
    <span class="header-title">魔方状态图例构建工具</span>
  </div>

  <div class="content">
    <!-- 模板切换 -->
    <div class="template-selector">
      <button class="template-btn active" data-tmpl="global" onclick="switchTemplate('global')">全局视角</button>
      <button class="template-btn" data-tmpl="top" onclick="switchTemplate('top')">顶层视角</button>
    </div>

    <!-- SVG 绘图区 -->
    <div class="svg-wrapper" id="svgWrapper"></div>

    <!-- 调色板 -->
    <div class="color-section">
      <div class="color-btn-wrapper" id="colorPalette"></div>
      <div class="mode-hint" id="modeHint">选贴纸模式：点击贴纸选中，再点击颜色上色</div>
    </div>
  </div>

  <!-- 底部操作 -->
  <div class="footer">
    <button class="action-btn secondary" onclick="resetAll()">重置</button>
    <button class="action-btn primary" onclick="exportSvg()">导出 SVG</button>
  </div>
</div>

// ========== 状态变量 ==========
let currentTemplate = 'global';
let selectedColor = null;
let selectedStickers = new Set();
let svgCache = { global: null, top: null };

// ========== 初始化 ==========
function init() {
  renderColorPalette();
  loadTemplate(currentTemplate);

  // SVG 点击事件委托
  const wrapper = document.getElementById('svgWrapper');
  wrapper.addEventListener('click', handleSvgClick);
}

// 渲染调色板
function renderColorPalette() {
  const container = document.getElementById('colorPalette');
  let html = '';
  for (const c of legendColors) {
    const labelColor = ['#ffffff','#ffff00','#ee8800'].includes(c.value) ? '#333' : '#fff';
    html += `<button class="color-btn" style="background:${c.value}" data-color="${c.value}" onclick="handleColorClick('${c.value}')"><span class="color-label" style="color:${labelColor}">${c.name}</span></button>`;
  }
  // 重置按钮
  html += `<button class="color-btn clear-btn" onclick="resetAll()">重置</button>`;
  container.innerHTML = html;
}

// 加载模板
function loadTemplate(tmplId) {
  const wrapper = document.getElementById('svgWrapper');
  if (svgCache[tmplId]) {
    wrapper.innerHTML = svgCache[tmplId];
  } else {
    wrapper.innerHTML = tmplId === 'top' ? topViewSvgTemplate : rubikCubeSvgTemplate;
  }
}

// 切换模板
function switchTemplate(tmplId) {
  if (tmplId === currentTemplate) return;

  // 保存当前涂色状态到缓存
  svgCache[currentTemplate] = document.getElementById('svgWrapper').innerHTML;

  currentTemplate = tmplId;
  selectedColor = null;
  selectedStickers.clear();

  // 更新 UI
  document.querySelectorAll('.template-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tmpl === tmplId);
  });
  document.querySelectorAll('.color-btn[data-color]').forEach(btn => {
    btn.classList.remove('active');
  });

  loadTemplate(tmplId);
  updateModeHint();
  clearStickerHighlights();
}

// 点击颜色
function handleColorClick(colorValue) {
  const paletteBtns = document.querySelectorAll('.color-btn[data-color]');

  if (selectedColor === colorValue) {
    // 再点同色 → 退出涂色模式
    selectedColor = null;
    paletteBtns.forEach(b => b.classList.toggle('active', false));
  } else if (selectedStickers.size > 0) {
    // 有选中贴纸 → 批量上色后退出
    applyColorToSelected(colorValue);
    selectedColor = null;
    selectedStickers.clear();
    paletteBtns.forEach(b => b.classList.toggle('active', false));
    clearStickerHighlights();
  } else {
    // 选颜色进入涂色模式
    selectedColor = colorValue;
    paletteBtns.forEach(b => b.classList.toggle('active', b.dataset.color === colorValue));
  }

  updateModeHint();
}

// SVG 区域点击（贴纸）
function handleSvgClick(e) {
  const target = e.target;
  if (!target.classList.contains('sticker')) return;
  const id = target.getAttribute('data-id');
  if (!id) return;

  if (selectedColor) {
    target.setAttribute('fill', selectedColor);
  } else {
    if (selectedStickers.has(id)) {
      selectedStickers.delete(id);
    } else {
      selectedStickers.add(id);
    }
    updateStickerHighlights();
  }
}

// 更新贴纸高亮
function updateStickerHighlights() {
  const stickers = document.querySelectorAll('#svgWrapper .sticker');
  stickers.forEach(s => {
    const id = s.getAttribute('data-id');
    if (selectedStickers.has(id)) {
      s.style.stroke = '#165DFF';
      s.style.strokeWidth = '1px';
    } else {
      s.style.stroke = '';
      s.style.strokeWidth = '';
    }
  });
}

function clearStickerHighlights() {
  document.querySelectorAll('#svgWrapper .sticker').forEach(s => {
    s.style.stroke = '';
    s.style.strokeWidth = '';
  });
}

// 给选中的贴纸上色
function applyColorToSelected(colorValue) {
  document.querySelectorAll('#svgWrapper .sticker').forEach(s => {
    if (selectedStickers.has(s.getAttribute('data-id'))) {
      s.setAttribute('fill', colorValue);
    }
  });
}

// 提示文案更新
function updateModeHint() {
  const hint = document.getElementById('modeHint');
  if (selectedColor) {
    hint.textContent = '涂色模式：点击贴纸直接上色，再点当前颜色退出';
    hint.classList.add('active-hint');
  } else {
    hint.textContent = '选贴纸模式：点击贴纸选中，再点击颜色上色';
    hint.classList.remove('active-hint');
  }
}

// 重置全部
function resetAll() {
  selectedColor = null;
  selectedStickers.clear();

  // 重置当前模板的贴纸颜色
  const defaultSvg = currentTemplate === 'top' ? topViewSvgTemplate : rubikCubeSvgTemplate;
  document.getElementById('svgWrapper').innerHTML = defaultSvg;
  svgCache[currentTemplate] = null;

  document.querySelectorAll('.color-btn[data-color]').forEach(b => b.classList.remove('active'));
  updateModeHint();
  clearStickerHighlights();
}

// 导出 SVG 文件
function exportSvg() {
  const svgEl = document.querySelector('#svgWrapper svg');
  if (!svgEl) return;

  // 序列化 SVG
  const serializer = new XMLSerializer();
  let svgStr = serializer.serializeToString(svgEl);

  // 确保有 XML 声明
  if (!svgStr.startsWith('<?xml')) {
    svgStr = '<?xml version="1.0" encoding="UTF-8"?>\n' + svgStr;
  }

  // 创建 Blob 并下载
  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `legend-${currentTemplate}-${Date.now()}.svg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// 启动
init();
</script>
</body>
