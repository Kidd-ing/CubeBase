<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>魔方公式库</title>
    <!-- 预加载主题：在页面渲染前同步读取 localStorage 并注入 CSS 变量，防止闪烁 -->
    <script>
    (function(){
      var t=localStorage.getItem('app-theme');
      if(!t)return;
      var m={default:{p:'#F8F6F3',h:'linear-gradient(135deg,#88CAC0 0%,#88C4CC 100%)',s:'rgba(136,196,204,0.25)',a:'#88C4CC',g:'rgba(136,196,204,0.5)'},blue:{p:'#F0F5FA',h:'linear-gradient(135deg,#74A9E8 0%,#5B9BD5 100%)',s:'rgba(91,155,213,0.25)',a:'#5B9BD5',g:'rgba(91,155,213,0.5)'},purple:{p:'#FAF5FF',h:'linear-gradient(135deg,#B794F6 0%,#9F7AEA 100%)',s:'rgba(159,122,234,0.25)',a:'#9F7AEA',g:'rgba(159,122,234,0.5)'},pink:{p:'#FFF5F7',h:'linear-gradient(135deg,#FC8181 0%,#F687B3 100%)',s:'rgba(246,135,179,0.25)',a:'#F687B3',g:'rgba(246,135,179,0.5)'},orange:{p:'#FFFAF0',h:'linear-gradient(135deg,#F6AD55 0%,#ED8936 100%)',s:'rgba(237,137,54,0.25)',a:'#ED8936',g:'rgba(237,137,54,0.5)'},green:{p:'#F0FFF4',h:'linear-gradient(135deg,#68D391 0%,#48BB78 100%)',s:'rgba(72,187,120,0.25)',a:'#48BB78',g:'rgba(72,187,120,0.5)'},red:{p:'#FFF5F5',h:'linear-gradient(135deg,#E88A8A 0%,#D85C5C 100%)',s:'rgba(216,92,92,0.25)',a:'#D85C5C',g:'rgba(216,92,92,0.5)'},white:{p:'#FAFAFA',h:'linear-gradient(135deg,#E2E8F0 0%,#CBD5E1 100%)',s:'rgba(203,213,225,0.25)',a:'#94A3B8',g:'rgba(148,163,184,0.5)',c:'#1D2129',b:'rgba(0,0,0,0.08)'},dark:{p:'#EDF2F7',h:'linear-gradient(135deg,#4A5568 0%,#2D3748 100%)',s:'rgba(45,55,72,0.25)',a:'#4A5568',g:'rgba(74,85,104,0.5)'}};
      var e=m[t];
      if(!e)return;
      var d=document.documentElement.style;
      d.setProperty('--theme-page-bg',e.p);
      d.setProperty('--theme-header-gradient',e.h);
      d.setProperty('--theme-header-shadow',e.s);
      d.setProperty('--theme-bottom-active-color',e.a);
      d.setProperty('--theme-bottom-active-glow',e.g);
      if(e.c){d.setProperty('--theme-header-text-color',e.c);d.setProperty('--theme-header-hover-bg',e.b)}
      else{d.setProperty('--theme-header-text-color','white');d.setProperty('--theme-header-hover-bg','rgba(255,255,255,0.15)')}
    })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
